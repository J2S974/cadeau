  $("mgx").onclick = closeMG;

  MG.walk = function (box, lv, end) {
    var W = Math.min(320, box.clientWidth || 300), Hh = 200, gy = 160, r = cvs(box, W, Hh), c = r[0], x = r[1];
    var t = 25, py = 0, vy = 0, lives = 3, bones = 0, ob = [], sp = 150 + lv * 12, nxt = 1, raf, last = performance.now(), scroll = 0, fin = false;
    function jump() { if (py === 0) vy = 420; }
    c.onpointerdown = jump; keyH = function (e) { if (e.key === " " || e.key === "ArrowUp") { e.preventDefault(); jump(); } };
    x.font = "26px 'Apple Color Emoji','Segoe UI Emoji',sans-serif"; x.textAlign = "center"; x.textBaseline = "alphabetic";
    function loop(now) {
      var dt = Math.min((now - last) / 1000, .05); last = now; t -= dt; nxt -= dt; scroll += sp * dt;
      if (py > 0 || vy > 0) { vy -= 1150 * dt; py = Math.max(0, py + vy * dt); if (py === 0) vy = 0; }
      if (nxt <= 0) { nxt = rnd(.9, 1.7); if (Math.random() < .55) ob.push({ x: W + 20, k: "o", e: ["🪨", "🪵", "💧"][(Math.random() * 3) | 0] }); else ob.push({ x: W + 20, k: "b", e: "🦴", h: rnd(40, 90) }); }
      ob.forEach(function (o) { o.x -= sp * dt; });
      ob = ob.filter(function (o) {
        if (Math.abs(o.x - 60) < 22) {
          if (o.k === "o" && py < 22) { lives--; return false; }
          if (o.k === "b" && Math.abs(py + 14 - o.h) < 30) { bones++; return false; }
        }
        return o.x > -30;
      });
      x.clearRect(0, 0, W, Hh); x.fillStyle = "#cfeaff"; x.fillRect(0, 0, W, gy); x.fillStyle = "#9bd37f"; x.fillRect(0, gy, W, Hh - gy);
      for (var i = 0; i < 4; i++) x.fillText("🌳", ((i * 120 - scroll * .4) % (W + 120) + W + 120) % (W + 120) - 40, gy - 4);
      x.fillText("🦮", 60, gy - py + 4);
      ob.forEach(function (o) { x.fillText(o.e, o.x, o.k === "b" ? gy - o.h : gy + 2); });
      x.fillStyle = "#4a3a3f"; x.font = "16px sans-serif"; x.textAlign = "left"; x.fillText("🦴 " + bones + "   ❤️ " + lives + "   ⏱ " + Math.max(0, Math.ceil(t)), 8, 20);
      x.font = "26px 'Apple Color Emoji','Segoe UI Emoji',sans-serif"; x.textAlign = "center";
      if (t <= 0 || lives <= 0) { fin = true; return setTimeout(function () { end(lives > 0, bones); }, 300); }
      raf = requestAnimationFrame(loop);
    }
    box.appendChild(mk("p", "cap", "Touche l'écran (ou Espace) pour sauter ! Ramasse les os 🦴"));
    raf = requestAnimationFrame(loop);
    return function () { fin = true; cancelAnimationFrame(raf); };
  };

  MG.ball = function (box, lv, end) {
    var W = Math.min(320, box.clientWidth || 300), Hh = 340, tg = Math.min(7 + lv * 2, 15), r = cvs(box, W, Hh), c = r[0], x = r[1];
    var px = W / 2, it = [], sc = 0, li = 3, raf, last = performance.now(), acc = 0, info = mk("p", "msg");
    box.appendChild(info);
    function hud() { info.textContent = "Attrapés : " + sc + "/" + tg + " · Vies : " + "❤️".repeat(Math.max(li, 0)); }
    function mv(e) { var b = c.getBoundingClientRect(); px = clamp((e.clientX - b.left) * (W / b.width), 20, W - 20); }
    c.onpointerdown = function (e) { c.setPointerCapture(e.pointerId); mv(e); }; c.onpointermove = mv;
    keyH = function (e) { if (e.key === "ArrowLeft") px = Math.max(20, px - 30); if (e.key === "ArrowRight") px = Math.min(W - 20, px + 30); };
    function loop(now) {
      var dt = Math.min(now - last, 50); last = now; acc += dt;
      if (acc > Math.max(850 - lv * 50, 450)) { acc = 0; it.push({ x: rnd(20, W - 20), y: -20, r: Math.random() < .2 + lv * .03, e: Math.random() < .6 ? "🎾" : "🦴" }); }
      var s = (.11 + lv * .012) * dt; it.forEach(function (o) { o.y += s; });
      it = it.filter(function (o) { if (o.y > Hh - 46 && o.y < Hh - 8 && Math.abs(o.x - px) < 34) { if (o.r) li--; else sc++; hud(); return false; } return o.y < Hh + 20; });
      x.clearRect(0, 0, W, Hh); x.font = "26px 'Apple Color Emoji','Segoe UI Emoji',sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
      it.forEach(function (o) { x.fillText(o.r ? "🪨" : o.e, o.x, o.y); }); x.font = "36px 'Apple Color Emoji','Segoe UI Emoji',sans-serif"; x.fillText("🦮", px, Hh - 26);
      if (sc >= tg) return setTimeout(function () { end(true, sc); }, 300); if (li <= 0) return setTimeout(function () { end(false, sc); }, 300);
      raf = requestAnimationFrame(loop);
    }
    hud(); box.appendChild(mk("p", "cap", "Glisse ton doigt pour déplacer le chien. Évite les cailloux 🪨"));
    raf = requestAnimationFrame(loop);
    return function () { cancelAnimationFrame(raf); };
  };

  MG.cups = function (box, lv, end) {
    var rounds = 3, okc = 0, rd = 0, bone = 0, pos = [0, 1, 2], cups = [], st = mk("p", "msg"), area = mk("div", "cups"), can = false, dead = false;
    box.appendChild(area); box.appendChild(st);
    for (var i = 0; i < 3; i++) (function (k) {
      var c = mk("div", "cup"); c.innerHTML = '<i class="bn">🦴</i><div class="cb"></div>'; c.onclick = function () { pick(k); }; cups.push(c); area.appendChild(c);
    })(i);
    function place() { cups.forEach(function (c, k) { c.style.left = (pos[k] * 34 + 3) + "%"; }); }
    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    function round() {
      if (dead) return; pos = [0, 1, 2]; place(); bone = (Math.random() * 3) | 0; can = false; st.textContent = "Regarde bien où est l'os… 👀";
      cups.forEach(function (c) { c.classList.remove("up"); c.querySelector(".bn").style.visibility = "hidden"; });
      cups[bone].querySelector(".bn").style.visibility = "visible"; cups[bone].classList.add("up");
      wait(1100).then(function () { cups[bone].classList.remove("up"); return wait(500); }).then(function () {
        var n = 5 + lv * 2, d = Math.max(340 - lv * 25, 190), p = Promise.resolve();
        for (var s = 0; s < n; s++) p = p.then(function () { if (dead) return; var a = (Math.random() * 3) | 0, b = (a + 1 + ((Math.random() * 2) | 0)) % 3, t = pos[a]; pos[a] = pos[b]; pos[b] = t; place(); return wait(d + 60); });
        return p;
      }).then(function () { if (dead) return; can = true; st.textContent = "Où est l'os ? Touche un gobelet !"; });
    }
    function pick(k) {
      if (!can || dead) return; can = false; cups[bone].querySelector(".bn").style.visibility = "visible"; cups[bone].classList.add("up"); cups[k].classList.add("up");
      var good = k === bone; if (good) okc++; st.textContent = good ? "Bravo ! 🎉" : "Raté… 😅";
      wait(1300).then(function () { if (dead) return; rd++; if (rd < rounds) round(); else end(okc >= 2, okc); });
    }
    round();
    return function () { dead = true; };
  };

  MG.orders = function (box, lv, end) {
    var CMD = [["Assis", "🪑"], ["Couché", "🛌"], ["Donne la patte", "🤝"], ["Roule", "🔄"], ["Fais le beau", "🕺"]], rd = 0, okc = 0, tm, dead = false;
    function round() {
      if (dead) return; box.innerHTML = ""; var cmd = CMD[(Math.random() * 5) | 0], dur = Math.max(4000 - lv * 300, 2200), done = false;
      box.appendChild(mk("p", "cap", "Ordre " + (rd + 1) + "/5")); box.appendChild(mk("p", "cmd", "Dis-lui : « " + cmd[0] + " » !"));
      var bar = mk("div", "tbar"), bi = mk("i"); bar.appendChild(bi); box.appendChild(bar);
      bi.style.transition = "width " + dur + "ms linear"; setTimeout(function () { bi.style.width = "0"; }, 30);
      var opts = shuffle([cmd].concat(shuffle(CMD.filter(function (z) { return z !== cmd; })).slice(0, 3)));
      function next(good, b) { if (done || dead) return; done = true; clearTimeout(tm); if (good) okc++; if (b) b.classList.add(good ? "good" : "bad"); setTimeout(function () { rd++; if (rd < 5) round(); else end(okc >= 4, okc); }, 600); }
      opts.forEach(function (o) { var b = mk("button", "opt", o[1] + " " + o[0]); b.type = "button"; b.onclick = function () { next(o === cmd, b); }; box.appendChild(b); });
      tm = setTimeout(function () { next(false, null); }, dur);
    }
    round();
    return function () { dead = true; clearTimeout(tm); };
  };

  MG.memo = function (box, lv, end) {
    var n = lv < 3 ? 6 : 8, E = ["🦴", "🎾", "🐾", "🧸", "🌷", "🍖", "💗", "🥎"].slice(0, n), deck = shuffle(E.concat(E)), first = null, lock = false, left = n, g = mk("div", "mem"), dead = false;
    deck.forEach(function (e) {
      var b = mk("button", "", "?"); b.type = "button";
      b.onclick = function () {
        if (lock || b.classList.contains("on")) return; b.classList.add("on"); b.textContent = e;
        if (!first) { first = b; return; }
        if (first.textContent === e) { first = null; if (--left === 0) setTimeout(function () { if (!dead) end(true, n); }, 500); }
        else { lock = true; var a = first; first = null; setTimeout(function () { a.classList.remove("on"); a.textContent = "?"; b.classList.remove("on"); b.textContent = "?"; lock = false; }, 800); }
      };
      g.appendChild(b);
    });
    box.appendChild(mk("p", "cap", "Retrouve toutes les paires !")); box.appendChild(g);
    return function () { dead = true; };
  };

  /* ---------- démarrage ---------- */
  function startWorld() {
    showV("vworld"); build(); lastSig = "";
    if (he && S.step < 4) { $("scene").hidden = true; $("stats").hidden = true; $("wn").textContent = "Le cadeau de Cassie 🎁"; $("wsub").textContent = ""; $("xpf").style.width = "0"; say("Elle ne l'a pas encore ouvert… surprise 😏"); return; }
    $("scene").hidden = false; $("stats").hidden = false; render(); say(he ? "👀 Tu regardes son chiot vivre sa vie." : S.name + " t'attend ! 🐶");
  }
  function route() { if (he) { startWorld(); return; } decay(S); if (S.step >= 4) startWorld(); else gift(); }
  if (!he) { try { var l = JSON.parse(localStorage.getItem("cass_pup") || "null"); if (l) S = Object.assign(S, l); } catch (e) {} }
  route();
  if (online) {
    var pull = function () {
      rget().then(function (r) {
        if (!r || (r.t || 0) <= (S.t || 0)) return;
        var wasStep = S.step; S = Object.assign(S, r);
        if (he) startWorld(); else if (wasStep < 4 && S.step >= 4) startWorld();
      }).catch(function () {});
    };
    pull(); if (he) setInterval(pull, 4000);
  }
  setInterval(function () { if (he) { if (S.step >= 4) render(); return; } if (S.step >= 4 && !busy) { decay(S); render(); save(); } }, 15000);
})();
